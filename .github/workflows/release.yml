name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    name: test ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [v1, v2]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uv sync --locked --extra dev
      - run: uv run pytest -q

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Write release notes from CHANGELOG.md
        # Fails when the changelog has no entry for this tag, or the packages declare another version.
        run: python3 scripts/release_notes.py "$GITHUB_REF_NAME" CHANGELOG.md --check-pyproject v1/pyproject.toml v2/pyproject.toml > release-notes.md
      - name: Build both packages
        run: |
          uv build --out-dir dist v1
          uv build --out-dir dist v2
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag
